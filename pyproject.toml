[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-census"
version = "0.1.0"
description = "Offline roadside vehicle tracking, make/model recognition, and counting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "opencv-python>=4.10,<5",
  "orjson>=3.10,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "supervision>=0.24,<0.27",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
pytorch = [
  "ultralytics>=8.3,<9",
]

[project.scripts]
car-census = "car_census.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["car_census*"]
