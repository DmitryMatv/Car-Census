[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Car-Census"
version = "0.1.0"
description = "Roadside car MMR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "opencv-python>=4.10,<5",
  "orjson>=3.10,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0,<7",
  "supervision>=0.28,<0.40",
  "trackers>=2.4,<3",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
Car-Census = "car_census_cli:app"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["car_census_cli", "config", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "detectors*",
  "mmr*",
  "pipeline*",
  "render*",
  "roi*",
  "stats*",
  "storage*",
  "tracking_adapters*",
  "utils*",
]
namespaces = true


[tool.mypy]
files = [
  "car_census_cli.py",
  "config.py",
  "models.py",
  "detectors",
  "mmr",
  "pipeline",
  "render",
  "roi",
  "stats",
  "storage",
  "tracking_adapters",
  "utils",
]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "cv2",
  "onnxruntime",
  "supervision",
  "trackers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "render.annotators"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "tracking_adapters.botsort"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "utils.video"
disable_error_code = ["attr-defined"]


[tool.pyrefly]
project-includes = [
    "car_census_cli.py",
    "config.py",
    "models.py",
    "detectors/**/*.py",
    "mmr/**/*.py",
    "pipeline/**/*.py",
    "render/**/*.py",
    "roi/**/*.py",
    "stats/**/*.py",
    "storage/**/*.py",
    "tracking_adapters/**/*.py",
]
project-excludes = [
    "**/__pycache__/**",
    ".venv/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    "output/**",
    "input_data/**",
    "tests/**",
]
replace-imports-with-any = [
    "cv2",
    "onnxruntime",
    "supervision",
    "trackers",
]
