[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Car-Census"
version = "0.1.0"
description = "Roadside car MMR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "opencv-python>=4.10,<5",
  "orjson>=3.10,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0,<7",
  "supervision>=0.28,<0.40",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
pytorch = [
  "ultralytics>=8.3,<9",
]
tracking = [
  "boxmot>=18,<19; python_version < '3.13'",
]

[project.scripts]
Car-Census = "car_census.cli:app"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["cli", "config", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "car_census*",
  "detectors*",
  "mmr*",
  "pipeline*",
  "render*",
  "roi*",
  "stats*",
  "storage*",
  "trackers*",
  "utils*",
]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
