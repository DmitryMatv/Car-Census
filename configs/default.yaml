project:
  output_root: output
  camera_profiles_dir: configs/cameras

video:
  fps: 30.0
  fps_tolerance: 0.05

analysis:
  fps: 10
  batch_size: 32
  imgsz: 640
  min_track_frames: 6
  min_box_height_px: 160
  crop_padding_ratio: 0.10
  crop_padding_px: 0
  crop_target_box_range_ratio: 0.55
  crop_min_spacing_seconds: 0.5
  crop_jpeg_quality: 95

detector:
  weights: weights/yolo26s_fp16.onnx
  confidence: 0.30
  iou: 0.45
  allowed_class_names:
    - car
    # - truck
    # - bus
    # - motorcycle
  onnx_threads: 6
  onnx_input_dtype: auto

tracker:
  lost_track_buffer: 45
  track_activation_threshold: 0.30
  minimum_consecutive_frames: 2
  minimum_iou_threshold_first_assoc: 0.08
  minimum_iou_threshold_second_assoc: 0.5
  minimum_iou_threshold_unconfirmed_assoc: 0.10
  high_conf_det_threshold: 0.30
  enable_cmc: false
  cmc_method: sparseOptFlow
  cmc_downscale: 2
  instant_first_frame_activation: true
  frame_rate: 0
  ignore_edge_touches: true
  edge_margin_px: 10

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 45.0
  accept_model_confidence: 0.60
  tasks:
    - DETECTION
    - MMR
  requested_detection_types:
    - BOX
  mmr_preference: BOX
  batch_size: 25
  batch_grid_columns: 5
  batch_cell_size_px: 512

render:
  codec: mp4v
  min_visible_track_observations: 6
  require_crop_eligible_track: true
  show_unclassified_tracks: false
  box_color: "#FFFFFF"
  label_font_scale: 0.7
  label_thickness: 2
  label_padding_px: 4
  label_gap_px: 8
  label_text_color: "#FFFFFF"
  label_bg_color: "#101820"
  corner_thickness: 4
  corner_length: 20
  unknown_label: Unknown
  smoothing:
    enabled: true
    interpolate: true
    interpolation_method: pchip
    max_gap_seconds: 0.5
    min_observations: 2
    max_center_offset_ratio: 0.3
    max_size_delta_ratio: 0.3
    reject_short_excursions: true
    max_excursion_observations: 2
    excursion_center_ratio: 1.25
