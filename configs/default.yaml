project:
  output_root: outputs
  device: auto
  camera_profiles_dir: configs/cameras

analysis:
  fps: 0.0
  imgsz: 640
  min_track_frames: 3
  min_box_height_px: 80
  crop_limit_per_track: 3
  crop_min_spacing_seconds: 0.5
  crop_jpeg_quality: 95

detector:
  provider: onnxruntime_local
  weights: weights/yolo26s.onnx
  confidence: 0.4
  iou: 0.4
  allowed_class_names:
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
  onnx_threads: 6

tracker:
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 3
  frame_rate: 0
  smoothing_alpha: 0.6
  smoothing_history: 10

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 45.0
  max_attempts_per_track: 3
  accept_model_confidence: 0.60

render:
  codec: mp4v
  font: cv2.FONT_HERSHEY_SIMPLEX
  label_font_scale: 1
  label_thickness: 4
  line_thickness: 2
  ellipse_thickness: 2
  trace_length: 30
  output_fps: 0.0
  unknown_label: unknown
