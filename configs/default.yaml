project:
  output_root: output
  camera_profiles_dir: configs/cameras
  retrieval_cache_dir: .mmr-cache

video:
  fps: 30.00
  fps_tolerance: 0.05

analysis:
  fps: 10
  batch_size: 16
  detector_batch_size: null 
  min_track_frames: 5
  min_box_width_px: 96
  crop_padding_ratio: 0.05
  crop_padding_px: 2
  crop_target_box_range_ratio: 0.777
  crop_min_spacing_seconds: 0.099
  crop_jpeg_quality: 95

detector:
  device: auto
  # Keep this below tracker.high_conf_det_threshold so BoT-SORT receives
  # low-confidence detections for its native second association pass.
  confidence: 0.15
  input_size: 576
  allowed_class_names:
    - car
    - truck
    - small truck
    - mid truck
    - big truck
    - pickup
    - pickup truck
    - van
    # - bus
    # - motorcycle
  # RF-DETR can emit the same box under competing COCO labels such as car and truck.
  # Suppress those duplicates before they can create parallel tracks.
  nms_enabled: true
  nms_iou_threshold: 0.80
  nms_class_agnostic: true
  pretrain_weights: null
  include_source_image: false
  optimize_for_inference: true
  inference_dtype: auto

tracker:
  # BoT-SORT scales this 30-FPS-equivalent value by analysis FPS.
  # 60 at the default 10 analysis FPS keeps IDs alive through ~2 s of missed
  # analysis frames; reattachment safety is enforced downstream by the
  # world-space reassociation gate, so the buffer no longer needs to stay
  # defensive on its own.
  lost_track_buffer: 60
  max_reassociation_gap_seconds: 0.35
  # World-space (homography) reassociation gate. When a track ID returns
  # after max_reassociation_gap_seconds but within
  # world_reassociation_max_gap_seconds, it is retained only if its road-plane
  # displacement is physically plausible:
  #   distance_m <= min(world_reassociation_max_distance_m,
  #                     world_reassociation_max_speed_mps * gap_seconds)
  # Requires a calibrated homography in the camera profile; without one the
  # legacy strict behavior applies unchanged.
  world_reassociation_enabled: true
  world_reassociation_max_gap_seconds: 2.0
  world_reassociation_max_speed_mps: 40.0
  world_reassociation_max_distance_m: 150.0
  track_activation_threshold: 0.30
  minimum_consecutive_frames: 2
  minimum_iou_threshold_first_assoc: 0.25 # tracker matching threshold for first association attempt
  minimum_iou_threshold_second_assoc: 0.50
  minimum_iou_threshold_unconfirmed_assoc: 0.20
  high_conf_det_threshold: 0.30
  enable_cmc: false
  cmc_method: sparseOptFlow
  cmc_downscale: 2
  instant_first_frame_activation: true
  frame_rate: 0
  ignore_edge_touches: true
  edge_margin_px: 10
  suppress_duplicate_tracks: false
  duplicate_track_iou_threshold: 0.80
  duplicate_track_containment_threshold: 0.95
  duplicate_track_min_area_ratio: 0.30
  duplicate_track_center_distance_ratio: 0.30
  suppress_sequential_duplicate_tracks: false
  # Extended from 0.70 s: post-hoc merges are now policed by the implied
  # world-speed gate (sequential_duplicate_max_implied_speed_mps) whenever a
  # camera homography is calibrated, so a wider gap window is safe.
  sequential_duplicate_max_gap_seconds: 2.0
  sequential_duplicate_prediction_error_ratio: 0.70
  sequential_duplicate_min_width_ratio: 0.50
  sequential_duplicate_min_height_ratio: 0.45
  sequential_duplicate_min_handoff_iou: 0.03
  sequential_duplicate_require_same_color: false
  sequential_duplicate_require_same_generation: false
  sequential_duplicate_require_same_variation: false
  # Post-hoc merge guard: a track pair may only be merged into one vehicle if
  # the implied road-plane speed between the two endpoints stays within this
  # limit. Requires a calibrated homography; null disables the world check.
  sequential_duplicate_max_implied_speed_mps: 40.0

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 30
  accept_model_confidence: 0.50
  mmr_preference: BOX
  batch_size: 1
  batch_grid_columns: 1
  batch_cell_size_px: 512
  retrieval_mode: enforce
  retrieval_embedding_distance_threshold: 0.02
  retrieval_phash_max_hamming_distance: 4
  retrieval_min_neighbors: 1
  retrieval_embedding_api_key_env: OPENROUTER_API_KEY
  retrieval_embedding_model: google/gemini-embedding-2
  retrieval_embedding_dimensions: 768
  retrieval_calibration_min_same_identity: 3
  retrieval_calibration_min_conflicting_identity: 3

render:
  codec: mp4v
  output_fps: null
  encode_backend: opencv
  workers: 1
  ffmpeg_path: ffmpeg
  nvenc_codec: h264_nvenc
  nvenc_preset: p4
  nvenc_cq: 23
  min_visible_track_observations: 5
  require_crop_eligible_track: true
  show_unclassified_tracks: false
  box_color: "#FFFFFF"
  box_enabled: true
  box_alpha: 0.5
  box_thickness: 2
  label_font_scale: 1
  label_thickness: 1
  label_padding_px: 6
  label_gap_px: 2
  label_flag_gap_px: 4
  label_text_color: "#FFFFFF"
  label_bev_text_color: "#47C8FF"
  label_mixed_text_color: "#39FF31"
  label_bg_color: "#000000"
  label_bg_alpha: 0.333
  label_scale_reference_box_width_px: 200
  counter_enabled: true
  counter_position: top_left
  unknown_label: UNKNOWN
  smoothing:
    enabled: true
    observed_box_smoothing: local_linear
    history_length: 1
    observed_smoothing_window: 5
    observed_smoothing_max_shift_ratio: 0.10
    bridge_missing_analysis_frames: true
    max_missing_analysis_gap_frames: 15
    interpolate_source_frames: true
    interpolation_method: linear
    max_interpolation_gap_seconds: 0.25
