project:
  output_root: outputs
  device: auto
  camera_profiles_dir: configs/cameras

analysis:
  fps: 10
  imgsz: 640
  min_track_frames: 3
  min_box_height_px: 80
  crop_limit_per_track: 3
  crop_min_spacing_seconds: 0.5
  crop_jpeg_quality: 95

detector:
  provider: onnxruntime_local
  weights: weights/yolo26n.onnx
  confidence: 0.4
  iou: 0.4
  allowed_class_names:
    - car
  onnx_threads: 6

tracker:
  provider: botsort
  track_high_thresh: 0.25
  track_low_thresh: 0.05
  new_track_thresh: 0.35
  track_buffer: 60
  match_thresh: 0.95
  minimum_consecutive_frames: 3
  frame_rate: 0
  fuse_first_associate: true
  cmc_method: ecc
  with_reid: false
  reid_weights: osnet_x0_25_msmt17.pt
  reid_device: auto
  reid_half: false
  proximity_thresh: 0.50
  appearance_thresh: 0.80
  ignore_edge_touches: false
  edge_margin_px: 0

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 45.0
  max_attempts_per_track: 3
  accept_model_confidence: 0.60

render:
  codec: mp4v
  font: cv2.FONT_HERSHEY_SIMPLEX
  label_font_scale: 1
  label_thickness: 1
  line_thickness: 1
  line_length: 30
  ellipse_thickness: 1
  trace_length: 30
  output_fps: 0.0
  unknown_label: unknown
  smoothing:
    enabled: true
    interpolate: true
    smooth_keyframes: false
    window_seconds: 0.25
    max_gap_seconds: 0.35
    min_observations: 3
    polynomial_order: 1
    max_center_offset_ratio: 0.20
    max_size_delta_ratio: 0.20
