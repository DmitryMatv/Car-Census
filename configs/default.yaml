project:
  output_root: outputs
  device: auto
  camera_profiles_dir: configs/cameras

analysis:
  fps: 5
  imgsz: 640
  min_track_frames: 10
  min_box_height_px: 80
  crop_padding_ratio: 0.10
  crop_padding_px: 0
  crop_limit_per_track: 3
  crop_min_spacing_seconds: 0.5
  crop_jpeg_quality: 95

detector:
  provider: onnxruntime_local
  weights: weights/yolo26s.onnx
  confidence: 0.4
  iou: 0.4
  allowed_class_names:
    - car
  onnx_threads: 6

tracker:
  provider: botsort
  track_high_thresh: 0.25
  track_low_thresh: 0.05
  new_track_thresh: 0.35
  track_buffer: 15
  match_thresh: 0.90
  minimum_consecutive_frames: 3
  frame_rate: 0
  fuse_first_associate: true
  cmc_method: null
  with_reid: false
  reid_weights: osnet_x0_25_msmt17.pt
  reid_device: auto
  reid_half: false
  proximity_thresh: 0.50
  appearance_thresh: 0.80
  ignore_edge_touches: true
  edge_margin_px: 0

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 45.0
  max_attempts_per_track: 3
  accept_model_confidence: 0.60

render:
  codec: mp4v
  #font: cv2.FONT_HERSHEY_SIMPLEX
  box_color: "#A855F7"
  label_font_scale: 0.8
  label_thickness: 2
  label_padding_px: 4
  #label_gap_px: 8
  label_text_color: "#FFFFFF"
  line_thickness: 1
  line_length: 30
  ellipse_thickness: 1
  corner_thickness: 4
  corner_length: 20
  trace_length: 30
  output_fps: 0.0
  unknown_label: Unknown
  smoothing:
    enabled: true
    interpolate: true
    interpolation_method: hermite
    smooth_keyframes: true
    window_seconds: 0.25
    max_gap_seconds: 0.65
    min_observations: 3
    polynomial_order: 2
    max_center_offset_ratio: 0.50
    max_size_delta_ratio: 0.50
