project:
  output_root: outputs
  device: auto
  camera_profiles_dir: configs/cameras

video:
  fps: 30.0
  fps_tolerance: 0.05

analysis:
  fps: 10
  imgsz: 640
  min_track_frames: 10
  min_box_height_px: 80
  crop_padding_ratio: 0.10
  crop_padding_px: 0
  crop_limit_per_track: 3
  crop_min_spacing_seconds: 0.5
  crop_jpeg_quality: 95

detector:
  provider: onnxruntime_local
  weights: weights/yolo26s.onnx
  confidence: 0.5
  iou: 0.4
  allowed_class_names:
    - car
  onnx_threads: 6

tracker:
  provider: botsort
  track_high_thresh: 0.35
  track_low_thresh: 0.05
  new_track_thresh: 0.50
  track_buffer: 30
  match_thresh: 0.90
  minimum_consecutive_frames: 7
  frame_rate: 0
  fuse_first_associate: true
  cmc_method: null
  with_reid: false
  reid_weights: osnet_x0_25_msmt17.pt
  reid_device: auto
  reid_half: false
  proximity_thresh: 0.50
  appearance_thresh: 0.80
  ignore_edge_touches: true
  edge_margin_px: 0

mmr:
  api_url: https://trafficeye.ai/recognition
  api_key_env: TRAFFICEYE_API_KEY
  timeout_seconds: 45.0
  accept_model_confidence: 0.60

render:
  codec: mp4v
  box_color: "#FFFFFF"
  label_font_scale: 0.8
  label_thickness: 2
  label_padding_px: 4
  label_gap_px: 5
  label_text_color: "#FFFFFF"
  label_bg_color: "#101820"
  label_bg_alpha: 0.0
  label_shadow_enabled: false
  label_shadow_color: "#000000"
  label_shadow_alpha: 0.45
  label_shadow_offset_px: 1
  label_shadow_thickness_extra: 1
  # Smart annotation text avoidance: set false to keep labels anchored under vehicles.
  label_smart_position: true
  label_max_offset_px: 48
  glow_enabled: true
  glow_color: "#FFFFFF"
  glow_radius_px: 9
  glow_alpha: 0.55
  label_glow_radius_px: 7
  label_glow_alpha: 0.30
  corner_thickness: 4
  corner_length: 20
  unknown_label: Unknown
  smoothing:
    enabled: true
    interpolate: true
    interpolation_method: hermite
    smooth_keyframes: true
    window_seconds: 0.25
    max_gap_seconds: 0.5
    min_observations: 2
    polynomial_order: 2
    max_center_offset_ratio: 0.3
    max_size_delta_ratio: 0.3
