homography:
  # Recalibrated 2026-09-01 (far-field overhaul). The previous 4-point
  # calibration (dash1 corners only) extrapolated the y-map to -100 m and
  # produced impossible track speeds (medians up to ~126 m/s) and rescue-
  # hostile world geometry. This calibration anchors the far field with nine
  # divider-dash anchors and pins the lateral map with all four lane lines.
  #
  # Anchors (25 pairs):
  #   - 4 near corners: ends of D1's first dash (world [0, 3] by definition)
  #     and the median-edge line at the same rows. Row values are subpixel
  #     half-max crossings of the paint mass profile (987.25 / 1114.71).
  #   - 9 far dash world-mid anchors: D1 k=3..7 (x'=3.75) and D2 k=3..6
  #     (x'=7.5) at the midpoints of strokes measured 36-87 m out. Dash
  #     pattern decided as 3 m stroke + 9 m gap (12 m cycle, strokes span
  #     [-12k, -12k+3]): subpixel measurement gives stroke 2.9-3.4 m and gap
  #     9.0-9.8 m; the 9 m-cycle (6 m gap) hypothesis fits 39x worse in a
  #     joint homography fit. Stroke k assignment is unambiguous.
  #   - 12 line samples: pixels on the refined L0/D1/D2/C1 line fits (the
  #     four lane boundary lines at x' = 0 / 3.75 / 7.5 / 11.25, all
  #     concurrent at VP (1272.2, 207.7)); their target y values are taken
  #     from the joint fit so the shipped pairs reproduce it.
  # Method: 9-frame consensus masking (gray >= 140-172, sat <= 60) to remove
  # traffic, per-line corridor fits, subpixel half-max stroke edges stable to
  # +/-0.1 row across thresholds.
  # Validation (held-out): D2's own near dash reads y' = 0.00 / 2.97; far
  # stroke lengths read 2.86-3.18 m; held-out C1 lateral reads 11.25 +/- 0.2
  # (lens distortion leaves ~0.1-0.2 m lateral wiggle at the road edges).
  # Track speeds through this H: 57/60 tracks land at plausible motorway
  # speeds (medians 19-31 m/s) versus garbage (up to 126 m/s medians) before.
  source_points: [
      [1560.88, 987.25],   # L0 corner @ dash1 far row (y'=0)
      [1608.23, 1114.71],  # L0 corner @ dash1 near row (y'=3)
